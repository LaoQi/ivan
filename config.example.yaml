base_url: https://api.openai.com/v1
api_key: ""
model: deepseek-v4-flash
temperature: 0.7
# API 协议：responses（默认，OpenAI Responses 兼容）/ chat（第三方兼容端点）
# api_protocol: responses
# 思考等级（标准字段 reasoning_effort）：minimal / low / medium / high / max
# reasoning_effort: medium
# 读图细节档位：low（默认）/ high / original / auto
# image_detail: low
# 读图单文件大小上限（字节）与预缩放
image_max_bytes: 10485760
image_resize: true
# 出站 User-Agent，默认 ivan/<版本> (+https://github.com/LaoQi/ivan)
# user_agent: ivan/dev (+https://github.com/LaoQi/ivan)
# 数据目录（与 tanya 分离；会话落于 <data_dir>/agents/<会话键>/，记忆落 <data_dir>/memory/）
data_dir: ~/.local/share/ivan
# 会话存储模式：auto / local / global（默认 global，会话集中在 data_dir）
session_mode: global
# 启动自动归档（ivan 不主动归档，仅保留配置位）
# auto_archive: false
# auto_archive_threshold: 64
# auto_archive_keep: 16

# 运行器与自主推进（见 docs/sessions.md）
runner:
  # 一级：建议交接阈值（tokens）。上下文达到后提示模型"收尾后交接"，模型可自行决定先做完当前步骤
  handoff_hint_tokens: 180000
  # 二级：强制交接阈值（tokens）。达到后要求模型立即交接，本回合不再做别的；模型仍不交接则停止本任务
  handoff_force_tokens: 256000
  # 自动续跑（默认关）：开启后单条消息触发的任务可在交接后自行继续；
  # 受 max_turns_per_task / max_tokens_per_task / max_tokens_per_day 与 ivan pause 约束
  auto_continue: false
  # 单任务自动续跑轮次上限
  max_turns_per_task: 8
  # 单任务 token 预算（0 = 不限）
  max_tokens_per_task: 0
  # 当日 token 预算（0 = 不限；含定时作业与自动续跑，落 state.json 跨重启累计）
  max_tokens_per_day: 0
  # 会话实例池上限（超出时淘汰最久未用的空闲实例）
  max_agents: 8
  # 空闲实例回收时间（分钟）
  idle_timeout_minutes: 30

# 常驻进程（见 docs/channels.md）
daemon:
  # cli 通道的 unix socket；相对路径落在 data_dir 下
  socket: ivan.sock
  # 总线缓冲深度（入站/出站各自，满了丢弃并计数）
  bus_buffer: 64
  # 跨会话并发回合上限（同一会话始终串行）
  max_concurrent: 2
  # 停机时等待在跑回合收尾的秒数，超时取消
  shutdown_timeout_seconds: 30
  # 出站单条发送超时（秒，含重试窗口）
  send_timeout_seconds: 60

# 计划任务（见 docs/schedule.md）
schedule:
  # 是否启用调度器（关掉后 schedule 工具不可用、启动不打开作业库）
  enabled: true
  # 作业库（sqlite，相对路径落在 data_dir 下）；损坏时保留原文件并显式报错
  jobs_db: jobs.db
  # 停机期间到期的作业：run（一次性提醒补跑，默认）/ skip（放弃）
  missed_policy: run
  # 单次作业执行超时（秒），超时取消该回合并记失败
  job_timeout_seconds: 900

channels:
  # 本地 cli 通道（unix socket，ivan send/status 用它）
  cli:
    enabled: true
  # QQ 官方机器人通道（见 docs/qq-bot.md）
  qq:
    enabled: false
    # 凭证从环境变量 IVAN_QQ_APP_ID / IVAN_QQ_APP_SECRET 注入更安全（文件需 0600）
    app_id: ""
    app_secret: ""
    # 允许的 openid / group_openid 白名单，空 = 全部允许
    allow_from: []
    allow_groups: []
    # 出站切分上限（通用切分器生效；cli 通道不切分）
    max_message_len: 1200
    # 被动回复窗口用尽后是否允许转为主动消息（平台频控 + 用户可关闭）
    allow_proactive: false
    # 网关重连指数退避上限（秒）
    reconnect_max_sec: 60
