base_url: https://api.openai.com/v1
api_key: ""
model: deepseek-v4-flash
temperature: 0.7
# API 协议：responses（默认，OpenAI Responses 兼容）/ chat（第三方兼容端点）
# api_protocol: responses
# 思考等级（标准字段 reasoning_effort）：minimal / low / medium / high / max
# reasoning_effort: medium
# 读图细节档位：low（默认）/ high / original / auto
# image_detail: low
# 读图单文件大小上限（字节）与预缩放
image_max_bytes: 10485760
image_resize: true
# 出站 User-Agent，默认 ivan/<版本> (+https://github.com/LaoQi/ivan)
# user_agent: ivan/dev (+https://github.com/LaoQi/ivan)
# 数据目录（与 tanya 分离；会话落于 <data_dir>/workspaces/<ws-id>/sessions/）
data_dir: ~/.local/share/ivan
# 会话存储模式：auto / local / global（默认 global，会话集中在 data_dir）
session_mode: global
# 启动自动归档（ivan 不主动归档，仅保留配置位）
# auto_archive: false
# auto_archive_threshold: 64
# auto_archive_keep: 16

# 运行器与自主推进（见 docs/sessions.md）
runner:
  # 模型上下文窗口（tokens），用于自动交接阈值判断
  context_window_tokens: 128000
  # 交接阈值：本地估算上下文 / 窗口 超过该比例时提示模型交接
  handoff_threshold: 0.7
  # 自动续跑（默认关）：开启后单条消息触发的任务可在交接后自行继续
  auto_continue: false
  # 单任务自动续跑轮次上限
  max_turns_per_task: 8
  # 单任务 token 预算（0 = 不限）
  max_tokens_per_task: 0
